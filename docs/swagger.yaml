basePath: /
definitions:
  models.Post:
    properties:
      author:
        description: Post author
        example: 234
        type: integer
      body:
        description: Post text
        example: this is my first psot and ...
        type: string
      id:
        description: The UUID of a post
        example: 345
        type: integer
      title:
        description: Post title
        example: first post
        type: string
    type: object
  utils.Response:
    properties:
      error:
        type: string
      status:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: This is a sample API blog service.
  title: Go Blog API
  version: "1.0"
paths:
  /post/{id}/:
    get:
      consumes:
      - application/json
      description: getting post instance
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Post'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Getting post instance
      tags:
      - posts
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: JWT
    type: apiKey
swagger: "2.0"
